name: devsecops

on:
  pull_request:
  push:
    branches: [main, trabalho-pratico]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pytest
        run: |
          python -m pip install -r requirements-dev.txt
          pytest

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: cobertura
        run: |
          python -m pip install -r requirements-dev.txt
          pytest --cov=app --cov-report=xml
      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias HIGH e CRITICAL
        id: deps
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          version: v0.58.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-deps-blocking.txt

      - name: Mostrar bloqueio das dependencias
        if: always()
        run: |
          if [ -f trivy-deps-blocking.txt ]; then
            cat trivy-deps-blocking.txt
          fi

      - name: Relatorio LOW e MEDIUM das dependencias
        if: steps.deps.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          version: v0.58.1
          severity: LOW,MEDIUM
          exit-code: "0"
          format: table
          output: trivy-deps-low-medium.txt

      - name: Build da imagem
        id: build
        if: always() && steps.deps.outcome != 'cancelled'
        run: docker build -t ufla-shop:ci .

      - name: Imagem HIGH e CRITICAL
        id: imagem
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ufla-shop:ci
          scanners: vuln
          version: v0.58.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          format: table
          output: trivy-imagem-blocking.txt

      - name: Mostrar bloqueio da imagem
        if: always()
        run: |
          if [ -f trivy-imagem-blocking.txt ]; then
            cat trivy-imagem-blocking.txt
          fi

      - name: Relatorio da imagem sem bloquear LOW e MEDIUM
        if: steps.deps.outcome == 'success' && steps.imagem.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ufla-shop:ci
          scanners: vuln
          version: v0.58.1
          severity: LOW,MEDIUM
          vuln-type: os,library
          exit-code: "0"
          format: table
          output: trivy-imagem-low-medium.txt

      - name: Artifact do relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-relatorio
          if-no-files-found: warn
          path: |
            trivy-deps-blocking.txt
            trivy-deps-low-medium.txt
            trivy-imagem-blocking.txt
            trivy-imagem-low-medium.txt

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t ufla-shop:ci .
      - name: Syft
        uses: anchore/sbom-action@v0
        with:
          image: ufla-shop:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Artifact do SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  publicar:
    name: publicar
    needs: [testes, gitleaks, sonarcloud, trivy, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        run: |
          set -euo pipefail
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          imagem="ghcr.io/${owner}/ufla-shop:1.1.0"
          docker build -t "$imagem" .
          docker push "$imagem"
